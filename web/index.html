<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">

    <title>幸存者 survivor-game</title>

    <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1,minimum-scale=1,maximum-scale=1,minimal-ui=true"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="full-screen" content="yes"/>
    <meta name="screen-orientation" content="landscape"/>
    <meta name="x5-fullscreen" content="true"/>
    <meta name="360-fullscreen" content="true"/>

    <meta name="renderer" content="webkit"/>
    <meta name="force-rendering" content="webkit"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>

    <link rel="stylesheet" type="text/css" href="./style.css"/>
    <link rel="icon" href="favicon.ico"/>
  </head>
  <body>
    <div id="GameDiv" cc_exact_fit_screen="true">
      <canvas id="GameCanvas" tabindex="99"></canvas>
    </div>

<!-- Polyfills bundle. -->
<script src="src/polyfills.bundle.js" charset="utf-8"> </script>

<!-- SystemJS support. -->
<script src="src/system.bundle.js" charset="utf-8"> </script>

<!-- Import map -->
<!-- __BUILD__ 由 deploy.ps1 替换成部署时间戳，强制浏览器重新下载，避免读到 10 分钟缓存的旧包 -->
<script src="src/import-map.json?v=__BUILD__" type="systemjs-importmap" charset="utf-8"> </script>

<script>
    System.import('./index.js?v=__BUILD__').catch(function(err) { console.error(err); })
</script>
  </body>
</html>
